# Tests on every push and pull request. A tag v<x> (VERSION in mods/git-grapher/version.js must be <x>) also builds the
# helper for four targets and publishes a release that Settings → Updates reads:
#   git-grapher-v<x>.tar.gz (the mod folder, no bin/), ggit-helper-<target>, SHA256SUMS
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm test

  helper:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} --manifest-path helper/Cargo.toml
      - run: cp helper/target/${{ matrix.target }}/release/ggit-helper ggit-helper-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ggit-helper-${{ matrix.target }}
          path: ggit-helper-${{ matrix.target }}

  release:
    needs: [test, helper]
    runs-on: ubuntu-22.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches VERSION
        run: |
          v=$(sed -n 's/^export const VERSION = "\(.*\)";/\1/p' mods/git-grapher/version.js)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but version.js says $v"; exit 1; }
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Package
        run: |
          tar -czf "dist/git-grapher-$GITHUB_REF_NAME.tar.gz" --exclude bin --exclude .dev-link -C mods git-grapher
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env: { GH_TOKEN: "${{ github.token }}" }
